<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-label="Smoke, load, stress, spike and soak tests and the question each one answers"><title>Smoke, load, stress, spike and soak tests and the question each one answers</title><rect width="1280" height="540" rx="20" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><text x="640.0" y="58" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#0A0F0C" text-anchor="middle" letter-spacing="-0.8">Pick the question you want answered</text><text x="640.0" y="90" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56615B" text-anchor="middle" >Each test type shapes the load differently. All of them can be edited.</text><rect x="40" y="124" width="224" height="372" rx="16" fill="#F6F8F7" stroke="#DCE3DF" stroke-width="2"/><text x="60" y="166" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.5">Smoke</text><rect x="60" y="182" width="184" height="130" rx="10" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="1.5"/><line x1="74" y1="198.0" x2="230" y2="198.0" stroke="#DCE3DF" stroke-width="1"/><line x1="74" y1="246.0" x2="230" y2="246.0" stroke="#DCE3DF" stroke-width="1"/><line x1="74" y1="294.0" x2="230" y2="294.0" stroke="#DCE3DF" stroke-width="1"/><circle cx="84.0" cy="282.5" r="5" fill="#0B5D3B"/><circle cx="111.2" cy="282.5" r="5" fill="#0B5D3B"/><circle cx="138.4" cy="282.5" r="5" fill="#0B5D3B"/><circle cx="165.6" cy="282.5" r="5" fill="#0B5D3B"/><circle cx="192.8" cy="282.5" r="5" fill="#0B5D3B"/><circle cx="220.0" cy="282.5" r="5" fill="#0B5D3B"/><text x="60" y="346" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0A0F0C" text-anchor="start" >Does it work</tex