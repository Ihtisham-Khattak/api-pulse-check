etica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0A0F0C" text-anchor="start" >normal traffic?</text><text x="304" y="396" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#56615B" text-anchor="start" >5 users, about 2 minutes</text><text x="304" y="430" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#56615B" text-anchor="start" letter-spacing="1.8">BEST FOR</text><rect x="304" y="440" width="184" height="38" rx="10" fill="#E7F6EE"/><text x="396.0" y="464" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B5D3B" text-anchor="middle" >Release checks</text><rect x="528" y="124" width="224" height="372" rx="16" fill="#F6F8F7" stroke="#DCE3DF" stroke-width="2"/><text x="548" y="166" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.5">Stress</text><rect x="548" y="182" width="184" height="130" rx="10" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="1.5"/><line x1="562" y1="198.0" x2="718" y2="198.0" stroke="#DCE3DF" stroke-width="1"/><line x1="562" y1="246.0" x2="718" y2="246.0" stroke="#DCE3DF" stroke-width="1"/><line x1="562" y1="294.0" x2="718" y2="294.0" stroke="#DCE3DF" stroke-width="1"/><polygon points="562,294 562.0,279.6 593.2,279.6 593.2,265.2 624.4,265.2 624.4,236.4 655.6,236.4 655.6,202.8 694.6,202.8 694.6,294.0 718,294" fill="#A15C00" opacity="0.14"/><polyline points="562.0,279.6 593.2,279.6 593.2,265.2 624.4,265.2 624.4,236.4 655.6,236.4 655.6,202.8 694.6,202.8 694.6,294.0" fill="none" stroke="#A15C00" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="548" y="346" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0A0F0C" text-anchor="start" >Where does it</t