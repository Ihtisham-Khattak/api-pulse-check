<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="564" viewBox="0 0 1280 564" role="img" aria-label="Eight features: localhost, real payloads, checks, live results, history, kept drafts, private secrets and CI scripts"><title>Eight features: localhost, real payloads, checks, live results, history, kept drafts, private secrets and CI scripts</title><rect width="1280" height="564" rx="20" fill="#F6F8F7" stroke="#DCE3DF" stroke-width="2"/><text x="640.0" y="58" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#0A0F0C" text-anchor="middle" letter-spacing="-0.8">Built for the way testers actually work</text><rect x="40" y="104" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="62" y="126" width="54" height="54" rx="13" fill="#E7F6EE"/><g transform="translate(76 140) scale(1.0833333333333333)" fill="none" stroke="#0B5D3B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8M12 16v5"/></g><text x="62" y="222" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.3">Works with localhost</text><text x="62" y="252" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >Test the site you are building</text><text x="62" y="274" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >right now. Test connection checks it.</text><rect x="350" y="104" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="372" y="126" width="54" height="54" rx="13" fill="#E7F6EE"/><g transform="translate(386 140) scale(1.0833333333333333)" fill="none" stroke="#0B5D3B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4C7 4 6 5 6 7v2c0 1.5-1 2.5-2 3 1 .5 2 1.5 2 3v2c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v2c0 1.5 1 2.5 2 3-1 .5-2 1.5-2 3v2c0 2-1 3-3 3"/></g><text x="372" y="222" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.3">Real payloads and data</text><text x="372" y="252" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >JSON bodies, CSV test data and</text><text x="372" y="274" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >values saved between requests.</text><rect x="660" y="104" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="682" y="126" width="54" height="54" rx="13" fill="#E7F6EE"/><g transform="translate(696 140) scale(1.0833333333333333)" fill="none" stroke="#0B5D3B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="7.5,12.5 10.8,15.8 16.5,9"/></g><text x="682" y="222" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.3">Checks that verify data</text><text x="682" y="252" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >Status, JSON fields, text and</text><text x="682" y="274" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >response time on every call.</text><rect x="970" y="104" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="992" y="126" width="54" height="54" rx="13" fill="#E7F6EE"/><g transform="translate(1006 140) scale(1.0833333333333333)" fill="none" stroke="#0B5D3B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a9 9 0 1 1 16 0"/><line x1="12" y1="15" x2="16.5" y2="8.5"/><circle cx="12" cy="15" r="1.3"/></g><text x="992" y="222" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.3">Live results</text><text x="992" y="252" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >Users, requests per second,</text><text x="992" y="274" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >p95 and errors as it runs.</text><rect x="40" y="324" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="62" y="346" width="54" height="54" rx="13" fill="#E7F6EE"/><g transform="translate(76 360) scale(1.0833333333333333)" fill="none" stroke="#0B5D3B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12 15.5,14"/></g><text x="62" y="442" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.3">History and compare</text><text x="62" y="472" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >Every run is kept. Put two side</text><text x="62" y="494" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >by side and see what changed.</text><rect x="350" y="324" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="372" y="346" width="54" height="54" rx="13" fill="#E7F6EE"/><g transform="translate(386 360) scale(1.0833333333333333)" fill="none" stroke="#0B5D3B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21,3 21,8 16,8"/></g><text x="372" y="442" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.3">Never loses your work</text><text x="372" y="472" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >Back, Next and refresh keep</text><text x="372" y="494" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >your entries. Start over any time.</text><rect x="660" y="324" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="682" y="346" width="54" height="54" rx="13" fill="#E7F6EE"/><g transform="translate(696 360) scale(1.0833333333333333)" fill="none" stroke="#0B5D3B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><polyline points="8.5,12 11,14.5 15.5,9.5"/></g><text x="682" y="442" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.3">Secrets stay private</text><text x="682" y="472" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >Tokens live in memory only. Never</text><text x="682" y="494" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >saved to history or reports.</text><rect x="970" y="324" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="992" y="346" width="54" height="54" rx="13" fill="#E7F6EE"/><g transform="translate(1006 360) scale(1.0833333333333333)" fill="none" stroke="#0B5D3B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,8 9,12 5,16"/><line x1="12" y1="16" x2="19" y2="16"/></g><text x="992" y="442" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A0F0C" text-anchor="start" letter-spacing="-0.3">CI-ready k6 scripts</text><text x="992" y="472" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >The same engine runs from the</text><text x="992" y="494" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >command line and GitHub Actions.</text></svg>
