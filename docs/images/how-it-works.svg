<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="How PulseCheck works: browser to site to k6 to your API, results saved on your computer"><title>How PulseCheck works: browser to site to k6 to your API, results saved on your computer</title><rect width="1280" height="520" rx="20" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><text x="640.0" y="58" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#0A0F0C" text-anchor="middle" letter-spacing="-0.8">How it works</text><text x="640.0" y="90" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56615B" text-anchor="middle" >The browser collects settings and shows results. k6 does the real testing on your computer.</text><rect x="36" y="118" width="800" height="360" rx="18" fill="#F6F8F7" stroke="#0D7D4D" stroke-width="2.5" stroke-dasharray="10 8"/><text x="58" y="148" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D7D4D" text-anchor="start" letter-spacing="2.4">ON YOUR COMPUTER</text><rect x="60" y="170" width="220" height="84" rx="14" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="76" y="186" width="44" height="44" rx="11" fill="#E7F6EE"/><g transform="translate(86 196) scale(1.0)" fill="none" stroke="#0B5D3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8M12 16v5"/></g><text x="132" y="210" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0A0F0C" text-anchor="start" >Your browser</text><text x="132" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#56615B" text-anchor="start" >Where you work</text><rect x="330" y="170" width="230" height="84" rx="14" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="346" y="186" width="44" height="44" rx="11" fill="#E7F6EE"/><g transform="translate(356 196) scale(1.0)" fill="none" stroke="#0B5D3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4C7 4 6 5 6 7v2c0 1.5-1 2.5-2 3 1 .5 2 1.5 2 3v2c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v2c0 1.5 1 2.5 2 3-1 .5-2 1.5-2 3v2c0 2-1 3-3 3"/></g><text x="402" y="210" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0A0F0C" text-anchor="start" >PulseCheck site</text><text x="402" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#56615B" text-anchor="start" >localhost:3000</text><rect x="610" y="170" width="200" height="84" rx="14" fill="#0B5D3B" stroke="#0B5D3B" stroke-width="2"/><rect x="626" y="186" width="44" height="44" rx="11" fill="#FFFFFF"/><g transform="translate(636 196) scale(1.0)" fill="none" stroke="#0B5D3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a9 9 0 1 1 16 0"/><line x1="12" y1="15" x2="16.5" y2="8.5"/><circle cx="12" cy="15" r="1.3"/></g><text x="682" y="210" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start" >k6</text><text x="682" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#CFEADB" text-anchor="start" >Runs the test</text><line x1="282" y1="212" x2="319" y2="212" stroke="#0D7D4D" stroke-width="3" stroke-linecap="round"/><polygon points="328,212 317,205.5 317,218.5" fill="#0D7D4D"/><line x1="562" y1="212" x2="599" y2="212" stroke="#0D7D4D" stroke-width="3" stroke-linecap="round"/><polygon points="608,212 597,205.5 597,218.5" fill="#0D7D4D"/><rect x="330" y="360" width="480" height="96" rx="14" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><rect x="346" y="376" width="44" height="44" rx="11" fill="#E7F6EE"/><g transform="translate(356 386) scale(1.0)" fill="none" stroke="#0B5D3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14,3 14,8 19,8"/><line x1="8.5" y1="13" x2="15.5" y2="13"/><line x1="8.5" y1="17" x2="13" y2="17"/></g><text x="404" y="400" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0A0F0C" text-anchor="start" >reports/runs/&lt;id&gt;/</text><text x="404" y="424" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#56615B" text-anchor="start" >config, summary, charts and HTML report</text><text x="404" y="446" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0D7D4D" text-anchor="start" >No tokens or passwords are ever saved.</text><line x1="710" y1="256" x2="710" y2="357" stroke="#0D7D4D" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round"/><polygon points="710,358 703.5,347 716.5,347" fill="#0D7D4D"/><text x="722" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0D7D4D" text-anchor="start" >5. saves the run</text><line x1="445" y1="357" x2="445" y2="258" stroke="#0D7D4D" stroke-width="3.5" stroke-linecap="round"/><polygon points="445,256 438.5,267 451.5,267" fill="#0D7D4D"/><text x="366" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0D7D4D" text-anchor="end" >6. verdict + charts</text><path d="M 710 168 C 710 122 445 122 445 168" fill="none" stroke="#3DDC84" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="3 9"/><text x="578" y="160" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0D7D4D" text-anchor="middle" >4. live progress</text><line x1="812" y1="212" x2="863" y2="212" stroke="#0D7D4D" stroke-width="3.5" stroke-linecap="round"/><polygon points="872,212 861,205.5 861,218.5" fill="#0D7D4D"/><rect x="874" y="150" width="372" height="124" rx="14" fill="#FFFFFF" stroke="#0B5D3B" stroke-width="2.5"/><rect x="892" y="170" width="48" height="48" rx="12" fill="#0B5D3B"/><g transform="translate(904 182) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4.2" ry="10"/><line x1="2" y1="12" x2="22" y2="12"/></g><text x="956" y="192" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0A0F0C" text-anchor="start" >Your API</text><text x="956" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#56615B" text-anchor="start" >Any address, even localhost</text><text x="892" y="250" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#0B5D3B" text-anchor="start" >http://localhost:4010</text><text x="1060" y="306" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0D7D4D" text-anchor="middle" >3. sends requests, runs checks</text><text x="874" y="336" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0A0F0C" text-anchor="start" >1  Choose a template or build a test</text><text x="874" y="362" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0A0F0C" text-anchor="start" >2  The site validates it and starts k6</text><text x="874" y="388" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0A0F0C" text-anchor="start" >3  k6 calls your API and checks the answers</text><text x="874" y="420" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#A15C00" text-anchor="start" >Heavy tests ask for confirmation first.</text></svg>
