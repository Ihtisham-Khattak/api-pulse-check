<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Join us: built for QA engineers, with QA engineers"><title>Join us: built for QA engineers, with QA engineers</title><rect width="1280" height="360" rx="20" fill="#0A0F0C"/><polyline points="760.0,62.0 826.0,62.0 848.0,24.6 874.4,106.0 896.4,46.6 914.0,62.0 1090.0,62.0" fill="none" stroke="#3DDC84" stroke-width="4" opacity="0.5" stroke-linejoin="miter" stroke-linecap="square"/><text x="56" y="82" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-1">Built for QA engineers,</text><text x="56" y="132" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#3DDC84" text-anchor="start" letter-spacing="-1">with QA engineers.</text><text x="56" y="176" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#BFD3C8" text-anchor="start" >You do not need to be a k6 or Next.js expert. Your testing experience is the most valuable thing you can bring.</text><rect x="56" y="206" width="274" height="116" rx="14" fill="#161D19" stroke="#28312C" stroke-width="2"/><rect x="74" y="226" width="44" height="44" rx="11" fill="#3DDC84"/><g transform="translate(84 236) scale(1.0)" fill="none" stroke="#0A0F0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="6" width="4" height="14" rx="1"/><rect x="16" y="9" width="4" height="11" rx="1"/></g><text x="132" y="246" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start" >Use it, report back</text><text x="132" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA59F" text-anchor="start" >A clear bug report is a gift.</text><text x="74" y="306" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3DDC84" text-anchor="start" >See "Join us" below</text><rect x="350" y="206" width="274" height="116" rx="14" fill="#161D19" stroke="#28312C" stroke-width="2"/><rect x="368" y="226" width="44" height="44" rx="11" fill="#3DDC84"/><g transform="translate(378 236) scale(1.0)" fill="none" stroke="#0A0F0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4C7 4 6 5 6 7v2c0 1.5-1 2.5-2 3 1 .5 2 1.5 2 3v2c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v2c0 1.5 1 2.5 2 3-1 .5-2 1.5-2 3v2c0 2-1 3-3 3"/></g><text x="426" y="246" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start" >Add a template</text><text x="426" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA59F" text-anchor="start" >Share a pattern you test often.</text><text x="368" y="306" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3DDC84" text-anchor="start" >See "Join us" below</text><rect x="644" y="206" width="274" height="116" rx="14" fill="#161D19" stroke="#28312C" stroke-width="2"/><rect x="662" y="226" width="44" height="44" rx="11" fill="#3DDC84"/><g transform="translate(672 236) scale(1.0)" fill="none" stroke="#0A0F0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,8 9,12 5,16"/><line x1="12" y1="16" x2="19" y2="16"/></g><text x="720" y="246" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start" >Write code</text><text x="720" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA59F" text-anchor="start" >Pick an idea from the roadmap.</text><text x="662" y="306" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3DDC84" text-anchor="start" >See "Join us" below</text><rect x="938" y="206" width="274" height="116" rx="14" fill="#161D19" stroke="#28312C" stroke-width="2"/><rect x="956" y="226" width="44" height="44" rx="11" fill="#3DDC84"/><g transform="translate(966 236) scale(1.0)" fill="none" stroke="#0A0F0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14,3 14,8 19,8"/><line x1="8.5" y1="13" x2="15.5" y2="13"/><line x1="8.5" y1="17" x2="13" y2="17"/></g><text x="1014" y="246" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start" >Improve the docs</text><text x="1014" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA59F" text-anchor="start" >Fix steps, add examples.</text><text x="956" y="306" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3DDC84" text-anchor="start" >See "Join us" below</text></svg>
