<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Roadmap: what works today, what is next and what comes later"><title>Roadmap: what works today, what is next and what comes later</title><rect width="1280" height="520" rx="20" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="2"/><text x="640.0" y="58" font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#0A0F0C" text-anchor="middle" letter-spacing="-0.8">Where Pulsar is going</text><text x="640.0" y="90" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#56615B" text-anchor="middle" >Ideas, not promises. Pick one and help build it.</text><rect x="40" y="120" width="380" height="370" rx="16" fill="#F6F8F7" stroke="#DCE3DF" stroke-width="2"/><rect x="40" y="120" width="380" height="52" rx="16" fill="#0B5D3B"/><rect x="40" y="150" width="380" height="22" fill="#0B5D3B"/><text x="64" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="2.2">WORKING TODAY</text><circle cx="74" cy="207" r="6" fill="#0B5D3B"/><text x="94" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Templates and a three-step builder</text><circle cx="74" cy="261" r="6" fill="#0B5D3B"/><text x="94" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Works with localhost, with Test connection</text><circle cx="74" cy="315" r="6" fill="#0B5D3B"/><text x="94" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Live runs, results, history, compare</text><circle cx="74" cy="369" r="6" fill="#0B5D3B"/><text x="94" y="374" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Drafts kept across steps and refresh</text><circle cx="74" cy="423" r="6" fill="#0B5D3B"/><text x="94" y="428" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >k6 scripts and GitHub Actions CI</text><rect x="440" y="120" width="380" height="370" rx="16" fill="#F6F8F7" stroke="#DCE3DF" stroke-width="2"/><rect x="440" y="120" width="380" height="52" rx="16" fill="#0D7D4D"/><rect x="440" y="150" width="380" height="22" fill="#0D7D4D"/><text x="464" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="2.2">NEXT UP</text><circle cx="474" cy="207" r="6" fill="#0D7D4D"/><text x="494" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Traffic mix: several flows with weights</text><circle cx="474" cy="261" r="6" fill="#0D7D4D"/><text x="494" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Import from cURL, Postman, OpenAPI</text><circle cx="474" cy="315" r="6" fill="#0D7D4D"/><text x="494" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Named environments (dev, staging)</text><circle cx="474" cy="369" r="6" fill="#0D7D4D"/><text x="494" y="374" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Richer checks: JSON schema, headers</text><circle cx="474" cy="423" r="6" fill="#0D7D4D"/><text x="494" y="428" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Tests for the site itself</text><rect x="840" y="120" width="380" height="370" rx="16" fill="#F6F8F7" stroke="#DCE3DF" stroke-width="2"/><rect x="840" y="120" width="380" height="52" rx="16" fill="#A15C00"/><rect x="840" y="150" width="380" height="22" fill="#A15C00"/><text x="864" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="2.2">LATER</text><circle cx="874" cy="207" r="6" fill="#A15C00"/><text x="894" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Regression detection against a baseline</text><circle cx="874" cy="261" r="6" fill="#A15C00"/><text x="894" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Scheduled runs and trend charts</text><circle cx="874" cy="315" r="6" fill="#A15C00"/><text x="894" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Run saved site tests in CI</text><circle cx="874" cy="369" r="6" fill="#A15C00"/><text x="894" y="374" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >Slack and email notifications</text><circle cx="874" cy="423" r="6" fill="#A15C00"/><text x="894" y="428" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#0A0F0C" text-anchor="start" >OAuth 2.0 and signed requests</text></svg>
